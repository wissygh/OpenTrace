  gen-verilog:
    name: gen-verilog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Scala
        uses: coursier/cache-action@v6

      - name: Setup Scala
        uses: coursier/setup-action@v1

      - name: Setup Mill
        uses: jodersky/setup-mill@v0.3.0
        with:
          mill-version: 0.12.5

      # - name: Verilator
      #   run: sudo apt install verilator

      - name: check-format
        run: make check-format

      - name: Compile and validate all supported RTL profiles
        run: make check-rtl check-smem-rtl check-hpm-rtl

      - name: Preserve RTL and profile manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentrace-rtl
          path: |
            build/rtl/
            build/validation/rtl-profile-manifest.json

      - name: clean
        run: make clean

