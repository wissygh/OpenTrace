adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $::env(OT_RBB_PORT)
transport select jtag
reset_config none
jtag newtap xs cpu -irlen 5 -expected-id 0x1
target create xs.cpu0 riscv -chain-position xs.cpu -coreid 0
target create xs.cpu1 riscv -chain-position xs.cpu -coreid 1
riscv set_command_timeout_sec 120
gdb port disabled
tcl port $::env(OT_TCL_PORT)
telnet port disabled
init
poll off
targets xs.cpu0
riscv set_mem_access sysbus
halt 120000
targets xs.cpu1
riscv set_mem_access sysbus
halt 120000
targets xs.cpu0
echo {[SBA] both harts halted; trace control uses external physical sysbus}
